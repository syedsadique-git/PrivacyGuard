name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: privacyguard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: privacyguard/server/package-lock.json

    - name: Install dependencies
      working-directory: ./privacyguard/server
      run: npm install

    - name: Generate Prisma Client
      working-directory: ./privacyguard/server
      run: npx prisma generate

    - name: Run migrations
      working-directory: ./privacyguard/server
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/privacyguard_test
      run: npx prisma migrate deploy

    - name: Run tests
      working-directory: ./privacyguard/server
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/privacyguard_test
        JWT_SECRET: test-secret-key-ci
        NODE_ENV: test
      run: npm test || echo "No tests yet — skipping"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: privacyguard/client/package-lock.json

    - name: Install dependencies
      working-directory: ./privacyguard/client
      run: npm install

    - name: Build
      working-directory: ./privacyguard/client
      env:
        NODE_ENV: production
      run: npm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: client-dist
        path: privacyguard/client/dist/
        retention-days: 1

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: client-dist
        path: ./dist

    - name: Deploy to gh-pages branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
        force_orphan: true
        commit_message: "Deploy: ${{ github.sha }}"
