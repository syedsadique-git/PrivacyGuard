<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyGuard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #050C14;
      color: #fff;
    }

    .header {
      background: #0A1628;
      padding: 16px;
      border-bottom: 1px solid #1A2942;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #00E5CC;
    }

    .shield-icon {
      width: 24px;
      height: 24px;
    }

    .content {
      padding: 16px;
    }

    .stat {
      background: #0A1628;
      border: 1px solid #1A2942;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .stat-label {
      font-size: 12px;
      color: #9CA3AF;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: #00E5CC;
    }

    .tracker-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 12px;
    }

    .tracker-item {
      background: #0A1628;
      border: 1px solid #1A2942;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .tracker-name {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .tracker-domain {
      color: #9CA3AF;
      font-size: 10px;
      font-family: 'Courier New', monospace;
    }

    .category {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      margin-top: 4px;
    }

    .category-analytics { background: #00E5CC20; color: #00E5CC; }
    .category-advertising { background: #FF4D4D20; color: #FF4D4D; }
    .category-social { background: #FFA50020; color: #FFA500; }
    .category-fingerprinting { background: #FF149320; color: #FF1493; }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0A1628;
      border: 1px solid #1A2942;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 600;
    }

    .switch {
      position: relative;
      width: 48px;
      height: 24px;
      background: #1A2942;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .switch.active {
      background: #00E5CC;
    }

    .switch-handle {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .switch.active .switch-handle {
      transform: translateX(24px);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #00E5CC;
      color: #050C14;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #00D4BB;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #9CA3AF;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0A1628;
    }

    ::-webkit-scrollbar-thumb {
      background: #1A2942;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>PrivacyGuard</span>
    </div>
  </div>

  <div class="content">
    <div class="stat">
      <div class="stat-label">Trackers on this page</div>
      <div class="stat-value" id="tracker-count">0</div>
    </div>

    <div class="toggle">
      <div class="toggle-label">Global Blocking</div>
      <div class="switch" id="blocking-toggle">
        <div class="switch-handle"></div>
      </div>
    </div>

    <div id="tracker-list" class="tracker-list"></div>

    <button class="btn" id="open-dashboard">Open Dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
